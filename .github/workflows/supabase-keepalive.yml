name: Supabase keepalive

# Evita a pausa por inatividade do Supabase Free (7 dias sem uso).
# Faz apenas uma leitura leve (GET de 1 linha), sem alterar dados.
#
# ATENCAO: o GitHub desativa workflows agendados depois de 60 dias sem
# commits no repositorio. Na entressafra, faca um commit qualquer ou rode
# manualmente (Actions > Supabase keepalive > Run workflow) pelo menos 1x a cada 60 dias.

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: DEV
            url_secret: SUPABASE_URL
            key_secret: SUPABASE_ANON_KEY
          - env: PROD
            url_secret: SUPABASE_URL_PROD
            key_secret: SUPABASE_ANON_KEY_PROD

    steps:
      - name: Lightweight REST request
        env:
          SUPABASE_URL: ${{ secrets[matrix.url_secret] }}
          SUPABASE_ANON_KEY: ${{ secrets[matrix.key_secret] }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets de ${{ matrix.env }} nao configurados; pulando."
            exit 0
          fi
          curl --fail --silent --show-error \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/rounds?select=id&limit=1" \
            > /dev/null
          echo "Ping ${{ matrix.env }} OK"
