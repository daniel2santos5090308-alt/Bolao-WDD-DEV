<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão WDD - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/styles.css?v=3.1" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Bolão WDD ⚽</h2>
            <p class="text-muted">Faça login para continuar</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" class="form-control" id="username" required placeholder="Seu usuário">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" required placeholder="Sua senha">
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Entrar</button>
            </div>
            <div class="text-center mt-3 d-none">
                <small class="text-muted">Não tem conta?</small>
                <a href="#" id="btnOpenRegister" class="text-decoration-none fw-bold">Cadastre-se</a>
            </div>
        </form>
    </div>

    <div class="alert alert-danger d-none mt-3 text-center" id="loginError" style="max-width: 400px;"></div>

    <!-- Modal Cadastro -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Novo Cadastro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regName" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="regName" required>
                        </div>
                        <div class="mb-3">
                            <label for="regUser" class="form-label">Usuário</label>
                            <input type="text" class="form-control" id="regUser" required>
                            <div class="form-text">Este será seu login.</div>
                        </div>
                        <div class="mb-3">
                            <label for="regPass" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="regPass" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">Criar Conta</button>
                        </div>
                        <div id="registerError" class="alert alert-danger d-none mt-3"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-init.js?v=3.0"></script>

    <script src="assets/js/utils.js?v=3.1"></script>
    <script src="assets/js/storage-supabase.js?v=3.4"></script>
    <script src="assets/js/auth.js?v=3.1"></script>
    <script src="assets/js/login.js?v=3.1"></script>
</body>
</html>
